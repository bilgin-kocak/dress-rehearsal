# Maps real tool names (as served in schemas/tools.json + schemas/catalog.json) to twin handlers.
#
# Keys are the real dotted names. The twin also accepts the underscore form Claude Code shows
# (spot_newOrder) and resolves tool_execute(toolName=...) through the same table.
#
# category: market_data | account | trade | transfer | convert | meta | unsupported
# handler:  a function name registered in rehearsal/server/handlers.py (+ handlers_extra.py)
# write:    true for tools that change state (orders, cancels, transfers, leverage, quotes)
tools:
  tool_search:                              {category: meta,        handler: tool_search}
  tool_execute:                             {category: meta,        handler: tool_execute}

  # ---- spot (exposed) --------------------------------------------------------------------
  spot.ticker24hr:                          {category: market_data, handler: spot_ticker24hr}
  spot.tickerPrice:                         {category: market_data, handler: spot_ticker_price}
  spot.depth:                               {category: market_data, handler: spot_depth}
  spot.klines:                              {category: market_data, handler: spot_klines}
  spot.uiKlines:                            {category: market_data, handler: spot_ui_klines}
  spot.exchangeInfo:                        {category: market_data, handler: spot_exchange_info}
  spot.getAccount:                          {category: account,     handler: spot_get_account}
  spot.newOrder:                            {category: trade,       handler: spot_new_order, market: spot, write: true}
  spot.deleteOrder:                         {category: trade,       handler: spot_cancel_order, market: spot, write: true}
  spot.deleteOpenOrders:                    {category: trade,       handler: spot_cancel_all, market: spot, write: true}
  spot.getOrder:                            {category: account,     handler: spot_get_order}
  spot.getOpenOrders:                       {category: account,     handler: spot_open_orders}
  spot.myTrades:                            {category: account,     handler: spot_my_trades}
  # ---- spot (hidden catalog, via tool_execute) -------------------------------------------
  spot.ticker:                              {category: market_data, handler: spot_rolling_ticker}
  spot.tickerBookTicker:                    {category: market_data, handler: spot_book_ticker}
  spot.tickerTradingDay:                    {category: market_data, handler: spot_ticker_trading_day}
  spot.aggTrades:                           {category: market_data, handler: spot_agg_trades}
  spot.getTrades:                           {category: market_data, handler: spot_recent_trades}
  spot.historicalTrades:                    {category: market_data, handler: spot_recent_trades}
  spot.avgPrice:                            {category: market_data, handler: spot_avg_price}
  spot.time:                                {category: market_data, handler: server_time}
  spot.ping:                                {category: market_data, handler: ping}
  spot.allOrders:                           {category: account,     handler: spot_all_orders}
  spot.orderTest:                           {category: trade,       handler: spot_new_order_test, market: spot}
  spot.rateLimitOrder:                      {category: account,     handler: spot_rate_limit_order}
  spot.accountCommission:                   {category: account,     handler: spot_account_commission}
  spot.myFilters:                           {category: account,     handler: spot_my_filters}

  # ---- USDⓈ-M futures (exposed) ----------------------------------------------------------
  futures_usds.exchangeInformation:         {category: market_data, handler: usdm_exchange_info}
  futures_usds.klineCandlestickData:        {category: market_data, handler: usdm_klines}
  futures_usds.markPriceKlineCandlestickData: {category: market_data, handler: usdm_mark_price_klines}
  futures_usds.indexPriceKlineCandlestickData: {category: market_data, handler: usdm_index_price_klines}
  futures_usds.premiumIndexKlineData:       {category: market_data, handler: usdm_premium_index_klines}
  futures_usds.continuousContractKlineCandlestickData: {category: market_data, handler: usdm_continuous_klines}
  futures_usds.symbolPriceTicker:           {category: market_data, handler: usdm_ticker_price}
  futures_usds.accountInformationV3:        {category: account,     handler: usdm_account}
  futures_usds.futuresAccountBalanceV3:     {category: account,     handler: usdm_balance}
  futures_usds.positionInformationV2:       {category: account,     handler: usdm_position_risk}
  futures_usds.currentAllOpenOrders:        {category: account,     handler: usdm_open_orders}
  futures_usds.queryOrder:                  {category: account,     handler: usdm_get_order}
  futures_usds.changeInitialLeverage:       {category: trade,       handler: usdm_change_leverage, market: usdm, write: true}
  futures_usds.changeMarginType:            {category: trade,       handler: usdm_change_margin_type, market: usdm, write: true}
  futures_usds.newOrder:                    {category: trade,       handler: usdm_new_order, market: usdm, write: true}
  futures_usds.cancelOrder:                 {category: trade,       handler: usdm_cancel_order, market: usdm, write: true}
  # ---- USDⓈ-M futures (hidden catalog) ---------------------------------------------------
  futures_usds.markPrice:                   {category: market_data, handler: usdm_mark_price}
  futures_usds.orderBook:                   {category: market_data, handler: usdm_depth}
  futures_usds.rpiOrderBook:                {category: market_data, handler: usdm_depth}
  futures_usds.ticker24hrPriceChangeStatistics: {category: market_data, handler: usdm_ticker24hr}
  futures_usds.symbolOrderBookTicker:       {category: market_data, handler: usdm_book_ticker}
  futures_usds.symbolPriceTickerV2:         {category: market_data, handler: usdm_ticker_price}
  futures_usds.getFundingRateHistory:       {category: market_data, handler: usdm_funding_rate}
  futures_usds.getFundingRateInfo:          {category: market_data, handler: usdm_funding_info}
  futures_usds.openInterest:                {category: market_data, handler: usdm_open_interest}
  futures_usds.compressedAggregateTradesList: {category: market_data, handler: usdm_agg_trades}
  futures_usds.recentTradesList:            {category: market_data, handler: usdm_agg_trades}
  futures_usds.notionalAndLeverageBrackets: {category: account,     handler: usdm_leverage_brackets}
  futures_usds.checkServerTime:             {category: market_data, handler: server_time}
  futures_usds.testConnectivity:            {category: market_data, handler: ping}
  futures_usds.accountInformationV2:        {category: account,     handler: usdm_account}
  futures_usds.futuresAccountBalanceV2:     {category: account,     handler: usdm_balance}
  futures_usds.positionInformationV3:       {category: account,     handler: usdm_position_risk_v3}
  futures_usds.allOrders:                   {category: account,     handler: usdm_all_orders}
  futures_usds.accountTradeList:            {category: account,     handler: usdm_user_trades}
  futures_usds.getIncomeHistory:            {category: account,     handler: usdm_income}
  futures_usds.orderStatus:                 {category: account,     handler: usdm_get_order}
  futures_usds.queryCurrentOpenOrder:       {category: account,     handler: usdm_get_open_order}
  futures_usds.getCurrentPositionMode:      {category: account,     handler: usdm_position_mode}
  futures_usds.getCurrentMultiAssetsMode:   {category: account,     handler: usdm_multi_assets_mode}
  futures_usds.futuresAccountConfiguration: {category: account,     handler: usdm_account_config}
  futures_usds.symbolConfiguration:         {category: account,     handler: usdm_symbol_config}
  futures_usds.userCommissionRate:          {category: account,     handler: usdm_commission_rate}
  futures_usds.cancelAllOpenOrders:         {category: trade,       handler: usdm_cancel_all, market: usdm, write: true}
  futures_usds.testOrder:                   {category: trade,       handler: usdm_new_order_test, market: usdm}

  # ---- wallet / transfer (exposed) --------------------------------------------------------
  wallet.accountStatus:                     {category: account,     handler: wallet_account_status}
  wallet.allCoinsInformation:               {category: account,     handler: wallet_all_coins}
  wallet.queryUserWalletBalance:            {category: account,     handler: wallet_balance}
  wallet.userUniversalTransfer:             {category: transfer,    handler: wallet_transfer, write: true}
  wallet.queryUserUniversalTransferHistory: {category: account,     handler: wallet_transfer_history}
  wallet.dailyAccountSnapshot:              {category: account,     handler: wallet_daily_snapshot}
  wallet.getApiKeyPermission:               {category: account,     handler: wallet_api_permission}
  wallet.depositHistory:                    {category: account,     handler: empty_list}
  wallet.withdrawHistory:                   {category: account,     handler: empty_list}
  wallet.depositAddress:                    {category: unsupported, handler: unsupported}
  # ---- wallet (hidden) -----------------------------------------------------------------
  wallet.systemStatus:                      {category: account,     handler: wallet_system_status}
  wallet.tradeFee:                          {category: account,     handler: wallet_trade_fee}
  wallet.accountInfo:                       {category: account,     handler: wallet_account_info}
  wallet.depositHistoryV2:                  {category: account,     handler: empty_list}
  wallet.withdrawHistoryV1:                 {category: account,     handler: empty_list}
  wallet.withdrawHistoryV2:                 {category: account,     handler: empty_list}
  wallet.dustlog:                           {category: account,     handler: empty_dustlog}
  wallet.assetDividendRecord:               {category: account,     handler: empty_rows}

  # ---- convert (exposed) ------------------------------------------------------------------
  convert.listAllConvertPairs:              {category: convert,     handler: convert_exchange_info}
  convert.queryOrderQuantityPrecisionPerAsset: {category: convert,  handler: convert_asset_precision}
  convert.sendQuoteRequest:                 {category: convert,     handler: convert_get_quote}
  convert.acceptQuote:                      {category: convert,     handler: convert_accept_quote, write: true}
  convert.orderStatus:                      {category: convert,     handler: convert_order_status}
  convert.getConvertTradeHistory:           {category: convert,     handler: convert_trade_flow}
  convert.placeLimitOrder:                  {category: unsupported, handler: unsupported, write: true}
  convert.cancelLimitOrder:                 {category: unsupported, handler: unsupported, write: true}
  convert.queryLimitOpenOrders:             {category: convert,     handler: convert_limit_open_orders}

  # ---- COIN-M futures (exposed): public market data passes through; account reads are empty;
  #      trading is not simulated (spec non-goal) ------------------------------------------
  futures_coin.exchangeInformation:         {category: market_data, handler: coinm_exchange_info}
  futures_coin.klineCandlestickData:        {category: market_data, handler: coinm_klines}
  futures_coin.markPriceKlineCandlestickData: {category: market_data, handler: coinm_mark_price_klines}
  futures_coin.indexPriceKlineCandlestickData: {category: market_data, handler: coinm_index_price_klines}
  futures_coin.premiumIndexKlineData:       {category: market_data, handler: coinm_premium_index_klines}
  futures_coin.continuousContractKlineCandlestickData: {category: market_data, handler: coinm_continuous_klines}
  futures_coin.symbolPriceTicker:           {category: market_data, handler: coinm_ticker_price}
  futures_coin.accountInformation:          {category: account,     handler: coinm_account}
  futures_coin.futuresAccountBalance:       {category: account,     handler: empty_list}
  futures_coin.positionInformation:         {category: account,     handler: empty_list}
  futures_coin.currentAllOpenOrders:        {category: account,     handler: empty_list}
  futures_coin.queryOrder:                  {category: account,     handler: no_such_order}
  futures_coin.newOrder:                    {category: unsupported, handler: unsupported, write: true}
  futures_coin.cancelOrder:                 {category: unsupported, handler: unsupported, write: true}
  futures_coin.changeInitialLeverage:       {category: unsupported, handler: unsupported, write: true}
  futures_coin.changeMarginType:            {category: unsupported, handler: unsupported, write: true}

  # ---- margin (exposed): read-only empty shapes; borrow/trade not simulated ----------------
  margin.queryCrossMarginAccountDetails:    {category: account,     handler: margin_account}
  margin.crossMarginCollateralRatio:        {category: account,     handler: empty_list}
  margin.getAllMarginAssets:                {category: account,     handler: margin_all_assets}
  margin.getAllIsolatedMarginSymbol:        {category: account,     handler: empty_list}
  margin.queryMarginAccountsAllOrders:      {category: account,     handler: empty_list}
  margin.queryMarginAccountsOpenOrders:     {category: account,     handler: empty_list}
  margin.queryMarginAccountsOrder:          {category: account,     handler: no_such_order}
  margin.queryMarginAccountsTradeList:      {category: account,     handler: empty_list}
  margin.queryMaxBorrow:                    {category: account,     handler: margin_max_borrow}
  margin.marginAccountNewOrder:             {category: unsupported, handler: unsupported, write: true}
  margin.marginAccountCancelOrder:          {category: unsupported, handler: unsupported, write: true}
  margin.marginAccountCancelAllOpenOrdersOnASymbol: {category: unsupported, handler: unsupported, write: true}
  margin.marginAccountBorrowRepay:          {category: unsupported, handler: unsupported, write: true}

  # ---- other ------------------------------------------------------------------------------
  sub_account.getMainAccountAsset:          {category: account,     handler: sub_account_main_assets}
  analysis.getTokenAiReport:                {category: unsupported, handler: unsupported}

# What to do with a tool that is served (exposed or hidden catalog) but not in this map:
#   passthrough_public: market-data-looking names are routed to the public REST API by heuristics;
#                       everything else returns {"code": -9001, "msg": "TWIN_UNSUPPORTED: <tool>"}.
unmapped_policy: passthrough_public
