[project]
name = "dress-rehearsal"
version = "0.1.0"
description = "A drop-in paper twin of the Binance Agent OS MCP server, plus a rehearsal harness that scores your agent and gates go-live."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "websockets>=12",
    "pyyaml>=6",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
rehearsal = "rehearsal.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rehearsal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
